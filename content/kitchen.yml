# 作り置きのページ。編集画面の「作り置き」から編集する
# published が false のあいだは、どのページからもリンクせず、検索にも載せない
published: false
hero:
  place_small: 東京・神奈川のご家庭へ
  place_big: 土日に訪問
  place_after: 野菜は長野の自分の畑から
  catch: |-
    畑の野菜で、
    作り置き。
  catch_sub: 一週間分の、ほっとするおかず。
intro:
  photo: ""
  lead: 長野の畑で育てた野菜を持って、ご自宅の台所で作り置きをつくります。
  body: |-
    平日の夕飯づくりを、週末のうちに済ませておくお手伝いです。旬の野菜をたっぷり使い、冷蔵庫に入れておけば数日楽しめるおかずを用意します。
    野菜は収穫から日が浅いものを持っていきます。ほかの食材は、事前にご相談のうえご用意ください。
steps:
  - title: 仮予約
    text: カレンダーから日時を選び、苦手な食材・アレルギーを教えてください。
  - title: 確定と献立の相談
    text: 確定のメールをお送りし、その時期の野菜をもとに献立を決めます。
  - title: ご自宅で調理
    text: 野菜を持って伺い、3時間ほどでおかずをつくります。
  - title: 片付けまで
    text: 保存容器に詰めて、台所を片付けて終わりです。
facts:
  - label: 料金
    value: 〇〇円〜
    note: 3時間・野菜代込み（仮）
  - label: 品数の目安
    value: 8〜10品
    note: 2人家族で3〜4日分（仮）
  - label: 対応エリア
    value: 東京・神奈川
    note: 区・市の範囲は準備中
faq:
  - question: 野菜以外の食材はどうなりますか？
    answer: 肉や魚、調味料などは、事前にご相談のうえご用意いただきます。（仮）
  - question: アレルギーや苦手な食材に対応できますか？
    answer: 予約のときに教えてください。その食材を使わない献立にします。
  - question: キャンセルはできますか？
    answer: 前日までのご連絡なら無料です。（仮）
