# 長野の畑のページ。編集画面の「長野の畑」から編集する
hero:
  place_small: 畑があるのは
  place_big: 標高500m
  place_after: 長野県〇〇市
  catch: |-
    長野で、
    畑をはじめます。
  catch_sub: 昼と夜の寒暖差が、野菜を甘くする。
intro:
  photo: ""
  lead: 東京で働きながら、長野に畑を借りました。
  body: |-
    きっかけは、長野で食べた野菜の甘さに驚いたこと。昼と夜の寒暖差が大きい信州では、野菜がゆっくり育ち、味がしっかりのります。
    まだ草だらけの土地ですが、土を起こすところから記録していきます。収穫できたら、この野菜で作り置きのお手伝いもはじめるつもりです。
journey:
  - when: 2026年 秋
    title: 土地を起こす
    text: 草を刈り、石を拾い、畑の形をつくります。
    now: true
  - when: 冬〜春
    title: 土をつくる
    text: 堆肥を入れて、雪の下で土を休ませます。
    now: false
  - when: 2027年 春
    title: 植えつけ
    text: 雪が解けたら、苗を植えていきます。
    now: false
  - when: 2027年 夏
    title: はじめての収穫
    text: 信州の夏は朝晩が涼しく、野菜がいちばんおいしい季節です。
    now: false
crops:
  - name: レタス
    season: 6〜9月
    text: みずみずしく、葉がやわらかい。
    photo: ""
  - name: キャベツ
    season: 7〜10月
    text: 甘みが強く、作り置きの主役に。
    photo: ""
  - name: とうもろこし
    season: 8〜9月
    text: 朝採りがいちばん甘い。
    photo: ""
  - name: 白菜
    season: 9〜11月
    text: 寒さにあたって甘くなる。
    photo: ""
crops_note: 育てる野菜と時期は、畑の様子を見ながら決めていきます。
insta:
  heading: 畑の今は、インスタで
  text: 土を起こす日も、雪の日も、毎日の様子をインスタに載せています。
next:
  - status: 準備中
    title: この野菜で、作り置き
    text: 畑の野菜を持って東京・神奈川のご家庭にうかがい、その場で作り置きをつくる予定です。
    kitchen_link: true
  - status: 準備中
    title: 野菜の直売
    text: 収穫が安定したら、直売をはじめます。開始はインスタでお知らせします。
    kitchen_link: false
