hero:
  place_small: 畑は長野、台所は東京・神奈川
  place_big: 東京 ⇄ 長野
  place_after: 二拠点で暮らしています
  catch: |-
    畑から、
    台所へ。
  catch_sub: 自分で育てた野菜で、作り置きを。
intro:
  photo: images/mvnxtiox-bq82lkkl.jpg
  lead: 〇〇です。長野で畑を、東京・神奈川で作り置きの仕事をしています。
  body: |-
    長野で食べた野菜のおいしさが忘れられず、自分で育てることにしました。
    育てた野菜を、忙しいご家庭の食卓に届けたい。そう考えて、野菜を持ってご家庭にうかがい、その場で作り置きをつくるサービスを準備しています。
farm_card:
  text: 標高500mの畑を、土を起こすところからはじめています。
kitchen_card:
  text: 東京・神奈川のご家庭にうかがって、その場でつくります。
insta:
  heading: 毎日のことは、インスタで
  text: 畑の様子も、作り置きの献立も、インスタに載せています。
